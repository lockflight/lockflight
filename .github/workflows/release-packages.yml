# Releases the Lockflight.Cli tool packages (a pointer package plus one Native AOT package per RID) to nuget.org.
#
# Runs for a pushed version tag (vX.Y.Z[-pre]), or by manual dispatch from such a tag ("Use workflow from" = the tag; with
# publish off it is a dry run). A dispatch from a branch is a dry run only: it builds 0.0.0-ci.<run number>, skips the
# tag and plugin-version checks, and refuses publish on. Every RID is built, tested, installed from a local feed, linked into a project and run through
# the hook compatibility suite before anything is pushed. Pushing needs the `nuget` environment, whose required reviewers
# approve each release, and uses nuget.org Trusted Publishing (OIDC): no API key is stored. The GitHub Release is created as a
# draft for the maintainer to edit and publish. Setup: docs/engineering/releasing.md. Versions are never re-published.
name: release-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to nuget.org and draft the GitHub Release (off = build and smoke-test only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag, the version and the plugin versions
        id: check
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            # A dry run from a branch: never publishes, and its version cannot collide with a release.
            if [ "$EVENT" != workflow_dispatch ] || [ "$PUBLISH_INPUT" = true ]; then
              echo "::error::publishing runs only from a version tag (got $REF)"; exit 1
            fi
            version="0.0.0-ci.$RUN_NUMBER"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Lockflight $version from $REF (dry run, publish: false)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --no-tags origin "+$REF:$REF"
          if [ "$(git rev-parse "$REF^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::the checkout is not the commit tagged $TAG"; exit 1
          fi
          # SemVer 2.0 without build metadata (NuGet ignores it, so two builds would collide).
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          version="${TAG#v}"
          if [ "$TAG" = "$version" ] || ! printf '%s\n' "$version" | grep -Eq "$semver"; then
            echo "::error::tag $TAG is not v<SemVer>"; exit 1
          fi
          for plugin in plugins/*/.claude-plugin/plugin.json; do
            declared=$(jq -r .version "$plugin")
            if [ "$declared" != "$version" ]; then
              echo "::error::$plugin declares $declared, the tag is $TAG"; exit 1
            fi
          done
          preset=plugins/lockflight/speckit-preset/preset.yml
          declared=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' "$preset" | head -n 1)
          if [ "$declared" != "$version" ]; then
            echo "::error::$preset declares ${declared:-no version}, the tag is $TAG"; exit 1
          fi
          publish=false
          if [ "$EVENT" = push ] || [ "$PUBLISH_INPUT" = true ]; then publish=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Lockflight $version (publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  rid:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engine/global.json
          # The workspace sample's orders service targets net8.0.
          dotnet-version: 8.0.x
      - name: Build
        working-directory: engine
        run: dotnet build -warnaserror -nologo
      - name: Unit tests
        working-directory: engine
        run: dotnet test --no-build
      - name: Pack ${{ matrix.rid }}, and a pointer for the smoke test
        working-directory: engine
        run: |
          dotnet pack src/Lockflight.Cli -c Release -r "$RID" -o ../packages -p:Version="$VERSION" -nologo
          dotnet pack src/Lockflight.Cli -c Release -o ../smoke-feed -p:Version="$VERSION" -nologo
          cp ../packages/*.nupkg ../smoke-feed/
      - name: Install from the local feed, run it and link it
        run: |
          # On Windows (Git Bash) RUNNER_TEMP is a Windows path, so take its POSIX form. There the tool's command is the
          # lockflight.cmd shim .NET writes for a RID-specific tool, and the engine link copies is lockflight.exe.
          temp="$RUNNER_TEMP" shim="" exe=""
          if command -v cygpath >/dev/null; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
          if [ "$RUNNER_OS" = Windows ]; then shim=.cmd exe=.exe; fi
          feed="$PWD/smoke-feed"
          tools="$temp/tools"
          # From an empty directory, so no global.json or NuGet.config of the checkout applies.
          mkdir -p "$temp/install" && cd "$temp/install"
          dotnet tool install Lockflight.Cli --tool-path "$tools" --version "$VERSION" --add-source "$feed"
          tool="$tools/lockflight$shim"
          [ -f "$tool" ] || { echo "::error::the install did not write $tool"; ls -la "$tools"; exit 1; }
          cat "$tool" # DEBUG
          installed=$("$tool" version | tr -d '\r')
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::the installed engine reports $installed, expected $VERSION"; exit 1
          fi
          # link copies the engine into a project; the copy must run on its own, as the hooks run it.
          project="$temp/link-project"
          mkdir -p "$project" && printf 'version: 1\n' > "$project/lockflight.yaml"
          (cd "$project" && "$tool" link)
          linked="$project/.lockflight/bin/lockflight$exe"
          [ -f "$linked" ] || { echo "::error::link did not write $linked"; exit 1; }
          [ "$("$linked" version)" = "$VERSION" ] || { echo "::error::the linked engine does not run"; exit 1; }
          echo "ENGINE=$linked" >> "$GITHUB_ENV"
      - name: Hook compatibility suite on the linked engine
        run: sh tests/compat/probe-suite.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}
          path: packages/*.nupkg
          if-no-files-found: error

  pointer:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engine/global.json
      - name: Pack the pointer package
        working-directory: engine
        run: dotnet pack src/Lockflight.Cli -c Release -o ../packages -p:Version="$VERSION" -nologo
      - name: Software bill of materials (CycloneDX)
        env:
          CYCLONEDX_VERSION: 6.3.1
        run: |
          dotnet tool install CycloneDX --version "$CYCLONEDX_VERSION" --tool-path "$RUNNER_TEMP/cyclonedx"
          "$RUNNER_TEMP/cyclonedx/dotnet-CycloneDX" engine/src/Lockflight.Cli/Lockflight.Cli.csproj \
            --output-format Json --output sbom --filename "lockflight-$VERSION.cdx.json" \
            --set-name Lockflight.Cli --set-version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-pointer
          path: packages/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error

  publish:
    needs: [version, rid, pointer]
    if: ${{ needs.version.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: packages
      - name: Checksums
        working-directory: packages
        run: |
          count=$(find . -name '*.nupkg' | wc -l)
          [ "$count" -eq 6 ] || { echo "::error::expected 6 packages, found $count"; exit 1; }
          sha256sum -- *.nupkg > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: packages/SHA256SUMS
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      # RID packages first and the pointer last: a client never sees a pointer whose RID packages are missing.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          source=https://api.nuget.org/v3/index.json
          for package in packages/Lockflight.Cli.*."$VERSION".nupkg; do
            dotnet nuget push "$package" --source "$source" --api-key "$NUGET_API_KEY" --skip-duplicate
          done
          dotnet nuget push "packages/Lockflight.Cli.$VERSION.nupkg" --source "$source" --api-key "$NUGET_API_KEY" --skip-duplicate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: packages/SHA256SUMS
          if-no-files-found: error

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Draft the notes from the commits since the previous tag
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --draft $prerelease --title "Lockflight $VERSION" \
            --notes-file release-notes.md release/*.nupkg release/SHA256SUMS release/*.cdx.json
