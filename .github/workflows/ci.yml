# Lockflight CI: engine tests, Native AOT build, the published engine's self-test and the LLM-free hook compatibility suite on
# Linux, Windows (Git Bash) and macOS, the engine's canary suite on each, the Windows install and update from a checkout, plus
# plugin and marketplace validation and the public-tree check.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run on macOS"
        type: boolean
        default: true

# A newer push to a pull request cancels its older run. Runs on main are never cancelled (each has its own group), so every
# commit that lands on main gets a complete result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.macos) && '[{"os":"ubuntu-latest","rid":"linux-x64"},{"os":"windows-latest","rid":"win-x64"},{"os":"macos-latest","rid":"osx-arm64"}]' || '[{"os":"ubuntu-latest","rid":"linux-x64"},{"os":"windows-latest","rid":"win-x64"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engine/global.json
          # The workspace sample's orders service targets net8.0 (xUnit v2 on VSTest).
          dotnet-version: 8.0.x
      # The secrets-step tests run the real gitleaks and skip where it is absent, so every runner installs the pinned release.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_WINDOWS_X64: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
          GITLEAKS_SHA256_DARWIN_ARM64: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
        run: |
          case "$RUNNER_OS" in
            Linux) archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; sum="$GITLEAKS_SHA256_LINUX_X64"; binary=gitleaks ;;
            Windows) archive="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"; sum="$GITLEAKS_SHA256_WINDOWS_X64"; binary=gitleaks.exe ;;
            macOS) archive="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"; sum="$GITLEAKS_SHA256_DARWIN_ARM64"; binary=gitleaks ;;
            *) echo "no gitleaks build for $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          if command -v sha256sum >/dev/null; then
            echo "$sum  $RUNNER_TEMP/$archive" | sha256sum -c -
          else
            echo "$sum  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          fi
          case "$archive" in
            *.zip) unzip -o -q "$RUNNER_TEMP/$archive" "$binary" -d "$RUNNER_TEMP" ;;
            *) tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "$binary" ;;
          esac
          "$RUNNER_TEMP/$binary" version
          echo "LOCKFLIGHT_GITLEAKS=$RUNNER_TEMP/$binary" >> "$GITHUB_ENV"
      # The canary suite (trait Category=Canary) runs in the canaries jobs.
      - name: Unit tests
        working-directory: engine
        run: dotnet test --filter-not-trait "Category=Canary"
      - name: Native AOT publish
        working-directory: engine
        run: dotnet publish src/Lockflight.Cli -c Release -r ${{ matrix.rid }} -o ../out -nologo
      - name: Self-test of the published engine (doctor --self-test)
        run: |
          engine="$PWD/out/lockflight"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          cd "$RUNNER_TEMP" && "$engine" doctor --self-test
      - name: Hook compatibility suite
        run: |
          engine="$PWD/out/lockflight"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          ENGINE="$engine" sh tests/compat/probe-suite.sh
      - name: Gate step order and run policies (stand-in SDK)
        if: runner.os != 'Windows'
        shell: bash
        run: ENGINE="$PWD/out/lockflight" bash tests/gates/step-order.sh
      - name: Lifecycle end to end (spec → approvals → red/green → trace)
        shell: bash
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          engine="$PWD/out/lockflight"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          ENGINE="$engine" bash tests/e2e/lifecycle.sh "$RUNNER_TEMP/lifecycle"
      - name: Lifecycle end to end on xUnit v2 (VSTest)
        shell: bash
        run: |
          engine="$PWD/out/lockflight"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          ENGINE="$engine" bash tests/e2e/lifecycle-xunit2.sh "$RUNNER_TEMP/lifecycle-xunit2"
      - name: Lifecycle end to end on NUnit (VSTest and Microsoft.Testing.Platform)
        shell: bash
        run: |
          engine="$PWD/out/lockflight"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          ENGINE="$engine" bash tests/e2e/lifecycle-nunit.sh "$RUNNER_TEMP/lifecycle-nunit"
      - name: Lifecycle end to end on MSTest (Microsoft.Testing.Platform and VSTest)
        shell: bash
        run: |
          engine="$PWD/out/lockflight"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          ENGINE="$engine" bash tests/e2e/lifecycle-mstest.sh "$RUNNER_TEMP/lifecycle-mstest"
      - name: The spec contract's example passes the phase checks, without Spec Kit
        shell: bash
        run: |
          engine="$PWD/out/lockflight"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          ENGINE="$engine" bash tests/e2e/spec-contract.sh "$RUNNER_TEMP/spec-contract"
      - name: Workspace gates end to end (units, VSTest and MTP, per-unit stop cache)
        shell: bash
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          engine="$PWD/out/lockflight"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          ENGINE="$engine" sh tests/workspace/gates.sh "$RUNNER_TEMP/workspace"
          ENGINE="$engine" bash tests/workspace/lifecycle.sh "$RUNNER_TEMP/workspace-lifecycle"
          ENGINE="$engine" sh tests/workspace/shell-pointer.sh "$RUNNER_TEMP/shell-pointer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockflight-${{ matrix.rid }}
          path: |
            out/lockflight
            out/lockflight.exe
          if-no-files-found: error

  # The Windows user install: scripts/dev-install.ps1 from a checkout in a folder with spaces, then the installed engine runs
  # init, link and the hook suite, and `lockflight update` replaces the engine it runs from, from source and from a package.
  windows-install:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engine/global.json
      - name: Install from a checkout (Windows PowerShell)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          # update pulls the checkout it was installed from, so the clone is on a branch that tracks one.
          git switch --quiet -c ci-install
          $source = Join-Path $env:RUNNER_TEMP "lockflight source"
          git clone --quiet "$PWD" "$source"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$source\scripts\dev-install.ps1" -NoPlugin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $userHome = if ($env:HOME) { $env:HOME } else { $env:USERPROFILE }
          "LOCKFLIGHT_SOURCE=$source" >> $env:GITHUB_ENV
          "LOCKFLIGHT_ENGINE=$(Join-Path $userHome '.lockflight\bin\lockflight.exe')" >> $env:GITHUB_ENV
      - name: Install again from Git Bash
        shell: bash
        run: |
          cd "$(cygpath -u "$LOCKFLIGHT_SOURCE")" && scripts/dev-install.sh --no-plugin
      - name: The user PATH holds the engine's folder once after two installs
        run: |
          $bin = Split-Path $env:LOCKFLIGHT_ENGINE
          $path = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Environment").GetValue("Path", "", "DoNotExpandEnvironmentNames")
          $count = @($path -split ";" | Where-Object { $_.TrimEnd([char]92) -ieq $bin }).Count
          if ($count -ne 1) { throw "the user PATH holds $bin $count times: $path" }
      - name: Version, init and link in a project, and the hook suite, with the installed engine
        run: |
          $engine = $env:LOCKFLIGHT_ENGINE
          & $engine version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $project = Join-Path $env:RUNNER_TEMP "a project"
          New-Item -ItemType Directory -Force $project | Out-Null
          Set-Location $project
          git init --quiet
          & $engine init
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $engine link
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((& .lockflight\bin\lockflight.exe version) -ne (& $engine version)) { throw "the linked engine is not the installed one" }
          "LOCKFLIGHT_PROJECT=$project" >> $env:GITHUB_ENV
      - name: Hook compatibility suite against the installed engine
        shell: bash
        run: ENGINE="$(cygpath -m "$LOCKFLIGHT_ENGINE")" sh tests/compat/probe-suite.sh
      - name: Update from source, replacing the running engine
        run: |
          Set-Location $env:LOCKFLIGHT_PROJECT
          & $env:LOCKFLIGHT_ENGINE update
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $env:LOCKFLIGHT_ENGINE version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Update from a package feed, replacing the running engine
        working-directory: engine
        run: |
          $feed = Join-Path $env:RUNNER_TEMP "package feed"
          $version = "99.0.0-ci.1"
          dotnet pack src/Lockflight.Cli -c Release -r win-x64 -o "$feed" "-p:Version=$version" -nologo -v q
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet pack src/Lockflight.Cli -c Release -o "$feed" "-p:Version=$version" -nologo -v q
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A package install records no checkout.
          Remove-Item (Join-Path (Split-Path (Split-Path $env:LOCKFLIGHT_ENGINE)) "source")
          Set-Location $env:LOCKFLIGHT_PROJECT
          & $env:LOCKFLIGHT_ENGINE update --source "$feed"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((& $env:LOCKFLIGHT_ENGINE version) -ne $version) { throw "the installed engine is not $version" }
          if ((& .lockflight\bin\lockflight.exe version) -ne $version) { throw "the project's engine is not $version" }

  # The engine's canary suite (engine/tests/Lockflight.Cli.Tests/Canaries, trait Category=Canary): a violation planted in front
  # of every guard rule, relay guard case, human-only command, in-session command check, gate step, the test gate's judgement and
  # the TaskCompleted hook, and on a generated .NET project the real test gate, red, amend, green and trace. It fails when one is
  # not caught, or when a registered guard rule, gate step or human-only command has no canary (CONTRIBUTING.md, Canaries).
  canaries:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.macos) && '[{"os":"ubuntu-latest","rid":"linux-x64"},{"os":"windows-latest","rid":"win-x64"},{"os":"macos-latest","rid":"osx-arm64"}]' || '[{"os":"ubuntu-latest","rid":"linux-x64"},{"os":"windows-latest","rid":"win-x64"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engine/global.json
      - name: Canary suite (dotnet test --filter-trait Category=Canary)
        working-directory: engine
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          dotnet test --filter-trait "Category=Canary"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install shellcheck (pinned, checksum-verified)
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      # Warnings and errors fail the job; style-only notes do not.
      - name: Shellcheck the hook shim and test scripts
        run: |
          shellcheck --version
          find tests -name '*.sh' -print0 | xargs -0 shellcheck -S warning plugins/lockflight/bin/lockflight-hook scripts/check-public-tree.sh scripts/dev-install.sh scripts/marketplace-ref.sh scripts/user-path.sh scripts/crew-trust-boundary.sh
      - name: The install puts its folder on PATH once, for each shell
        run: sh tests/install/user-path.sh
      # The crew gives advice and the engine judges: the crew plugin ships no hooks, executables, policy files or
      # verdicts. release-crew.yml runs the same check before a crew/v* release.
      - name: The crew stays on the advice side of the trust boundary
        run: |
          scripts/crew-trust-boundary.sh
          bash tests/release/crew-trust-boundary.sh
      - name: The marketplace pin check refuses incoherent pins
        run: bash tests/install/marketplace-ref.sh
      - name: The release's engine hashes describe the packages
        run: bash tests/release/engine-hashes.sh
      # dash, bash and BusyBox sh on the runner, then inside the .NET SDK image, whose only zip reader is perl; and the
      # Windows install script with PowerShell 7.
      - name: The engine install script checks the hash before anything runs it
        run: |
          docker run --rm busybox:1.37-musl cat /bin/busybox > "$RUNNER_TEMP/busybox" && chmod +x "$RUNNER_TEMP/busybox"
          PATH="$PATH:$RUNNER_TEMP" SHELLS="dash bash busybox-sh" bash tests/install/install-script.sh
          docker run --rm -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 bash tests/install/install-script.sh
          bash tests/install/install-ps1.sh
      # The marketplace users add serves the plugins from a release tag; it must name a pushed tag whose plugins have the tag's
      # version, with the engine on nuget.org (docs/engineering/releasing.md).
      - name: The marketplace serves a published release
        run: scripts/marketplace-ref.sh check
      - name: No citations of records outside the repository
        run: scripts/check-public-tree.sh
      # Pinned so a Claude Code release cannot change validation results unannounced. To bump: run
      # `claude plugin validate --strict` on both plugins and the marketplace with the new version, then change it here and in
      # canary.yml together.
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate --strict plugins/lockflight
          claude plugin validate --strict plugins/lockflight-crew
          claude plugin validate --strict .
          claude plugin validate --strict plugins
