# Releases the lockflight-crew plugin on its own: crew tags are crew/vX.Y.Z[-pre], the judge's are vX.Y.Z.
# The crew has no NuGet package; its release is a GitHub Release with the plugin as an archive and its SHA-256. The crew gives
# advice and the engine judges, so a release is refused unless the crew passes its trust boundary
# (scripts/crew-trust-boundary.sh: no hooks, executables, policy files or verdicts), validates strictly, and names in
# plugins/lockflight-crew/min-engine-version an engine that is published on nuget.org.
#
# Runs for a pushed crew tag, or by manual dispatch. A dispatch from a branch is a dry run: version 0.0.0-ci.<run number>, no
# tag, version or nuget.org checks, and nothing is published (publish on is refused). A dispatch from a crew tag with publish
# off is a dry run of that release. Setup and steps: docs/engineering/releasing.md.
name: release-crew

on:
  push:
    tags: ["crew/v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub Release (off = build and check only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-crew-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag, the crew version and the engine it needs
        id: version
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          manifest=plugins/lockflight-crew/.claude-plugin/plugin.json
          minimum_file=plugins/lockflight-crew/min-engine-version
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          minimum=$(tr -d '[:space:]' < "$minimum_file")
          if ! printf '%s\n' "$minimum" | grep -Eq "$semver"; then
            echo "::error::$minimum_file holds '${minimum}', not a released engine version"; exit 1
          fi
          if [ "$REF_TYPE" != tag ]; then
            if [ "$EVENT" != workflow_dispatch ] || [ "$PUBLISH_INPUT" = true ]; then
              echo "::error::publishing runs only from a crew tag (got $REF)"; exit 1
            fi
            version="0.0.0-ci.$RUN_NUMBER"
            { echo "version=$version"; echo "publish=false"; } >> "$GITHUB_OUTPUT"
            echo "Lockflight crew $version from $REF (dry run; needs engine $minimum)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$TAG" in
            crew/v*) version="${TAG#crew/v}" ;;
            *) echo "::error::tag $TAG is not crew/v<SemVer>"; exit 1 ;;
          esac
          if ! printf '%s\n' "$version" | grep -Eq "$semver"; then
            echo "::error::tag $TAG is not crew/v<SemVer>"; exit 1
          fi
          git fetch --no-tags origin "+$REF:$REF"
          if [ "$(git rev-parse "$REF^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::the checkout is not the commit tagged $TAG"; exit 1
          fi
          # A release is cut from main. A guardrail against tagging another commit: a tagged commit with an edited workflow
          # skips it, so the tag ruleset (docs/engineering/releasing.md) is what limits who can start a release.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main: tag a commit of main"; exit 1
          fi
          declared=$(jq -r .version "$manifest")
          if [ "$declared" != "$version" ]; then
            echo "::error::$manifest declares $declared, the tag is $TAG"; exit 1
          fi
          # The crew calls the engine (phase check, redgreen red, facts): it is never released before the engine it needs.
          index=https://api.nuget.org/v3-flatcontainer/lockflight.cli/index.json
          if ! curl -fsSL --retry 3 "$index" | jq -e --arg v "${minimum,,}" '.versions | index($v)' > /dev/null; then
            echo "::error::nuget.org does not list Lockflight.Cli $minimum, which $minimum_file names: release the engine first"; exit 1
          fi
          publish=false
          if [ "$EVENT" = push ] || [ "$PUBLISH_INPUT" = true ]; then publish=true; fi
          { echo "version=$version"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"
          echo "Lockflight crew $version (needs engine $minimum; publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The crew gives advice only (no hooks, executables, policy files or verdicts)
        run: |
          scripts/crew-trust-boundary.sh
          bash tests/release/crew-trust-boundary.sh
      # The same pinned Claude Code as ci.yml; bump both together.
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      - name: Validate the crew plugin
        run: claude plugin validate --strict plugins/lockflight-crew

  package:
    needs: [check, validate]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Archive the plugin from the commit, with its SHA-256
        run: |
          mkdir -p release
          archive="lockflight-crew-$VERSION.tar.gz"
          # From git, not the working tree: exactly the committed files, with stable names and modes.
          git archive --format=tar.gz --prefix="lockflight-crew/" -o "release/$archive" HEAD:plugins/lockflight-crew
          (cd release && sha256sum "$archive" > SHA256SUMS && cat SHA256SUMS)
          # Re-check what was archived, not the checkout.
          mkdir unpacked && tar -xzf "release/$archive" -C unpacked
          scripts/crew-trust-boundary.sh "$PWD/unpacked/lockflight-crew"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crew-release
          path: release/
          if-no-files-found: error

  release:
    needs: [check, package]
    if: ${{ needs.check.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/crew/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crew-release
          path: release
      - name: The archive is the one packed
        run: (cd release && sha256sum -c SHA256SUMS)
      - name: Draft the notes from the crew's commits since the previous crew tag
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --latest --strip header --tag-pattern "^crew/v[0-9].*" --include-path "plugins/lockflight-crew/**"
        env:
          OUTPUT: release-notes.md
      # Never marked latest: the latest release is the judge's, which the install script and the docs point at.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --latest=false $prerelease --title "Lockflight crew $VERSION" \
            --notes-file release-notes.md release/*.tar.gz release/SHA256SUMS
