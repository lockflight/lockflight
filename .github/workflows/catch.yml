# The catch benchmark (benchmarks/catch): scripted pull requests on the samples, honest controls and agent cheats, judged by
# Lockflight's CI judge and by a plain `dotnet test` with a patch coverage threshold. Nothing here calls a model. Each job
# runs its pull requests one after the other and uploads JSON lines; the last job summarizes them with the jobs' runner
# minutes. The numbers are recorded, not checked: a job fails only when the harness could not run.
name: catch

on:
  workflow_dispatch:
  # A change to the benchmark itself is measured before it merges.
  pull_request:
    paths:
      - .github/workflows/catch.yml
      - benchmarks/catch/**

concurrency:
  group: catch-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  measure:
    name: measure (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: single-1, samples: dotnet-single, only: "^(control|impl-|no-red|tautology|cycle-test-deleted|existing-test-|cycle-test-skipped|test-project-dropped)" }
          - { shard: single-2, samples: dotnet-single, only: "^(amend-|cycle-expectation|existing-expectation|padding-|policy-file|warnings-off|pragma|exclude-coverage|exit-code|ignore-exit-code)" }
          - { shard: mstest-nunit, samples: "dotnet-mstest dotnet-nunit", only: "" }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: engine/global.json
      - name: Install gitleaks (pinned, checksum-verified)
        uses: ./.github/actions/install-gitleaks
      - name: Native AOT publish
        working-directory: engine
        run: dotnet publish src/Lockflight.Cli -c Release -r linux-x64 -o ../out -nologo
      - name: Git identity for the benchmark's commits
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: The pull requests, one at a time
        env:
          ONLY: ${{ matrix.only }}
          SAMPLES: ${{ matrix.samples }}
        run: |
          # shellcheck disable=SC2086 # the samples are a list
          RESULTS="$RUNNER_TEMP/catch-${{ matrix.shard }}.jsonl" ENGINE="$PWD/out/lockflight" \
            bash benchmarks/catch/run.sh "$RUNNER_TEMP/catch" $SAMPLES
          test -s "$RUNNER_TEMP/catch-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: catch-${{ matrix.shard }}
          path: ${{ runner.temp }}/catch-${{ matrix.shard }}.jsonl
          if-no-files-found: warn

  summary:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: catch-*
          path: ${{ runner.temp }}/catch
          merge-multiple: true
      - name: Results and runner minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/catch/*.jsonl)
          if [ "${#files[@]}" -eq 0 ]; then echo "no results" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/out"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | select(.name | startswith("measure")) | {name, started_at, completed_at}]' > "$RUNNER_TEMP/out/jobs.json"
          python3 -I benchmarks/catch/catch.py summarize --date "$(date -u +%Y-%m-%d)" \
            --runner "GitHub-hosted ubuntu-latest ($ImageOS $ImageVersion)" --engine "built from ${GITHUB_SHA::8}" \
            --jobs "$RUNNER_TEMP/out/jobs.json" --out-md "$RUNNER_TEMP/out/catch.md" --out-json "$RUNNER_TEMP/out/catch.json" "${files[@]}"
          cat "$RUNNER_TEMP/out/catch.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: catch-results
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
