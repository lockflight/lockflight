<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img"><title>How the CI judge works: the pull request is judged by three jobs under the target branch's policy, and the report sets two status contexts with one of four verdicts</title><rect width="1040" height="400" rx="20" fill="#FFFFFF" stroke="#D5DEE2"/><rect x="232" y="28" width="568" height="44" rx="10" fill="#F2A33A" fill-opacity="0.16"/><text x="516" y="56" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="700" fill="#0E1F2B">Target branch: policy, baselines and the pinned engine</text><line x1="330" y1="72" x2="330" y2="96" stroke="#F2A33A" stroke-width="2" stroke-dasharray="4 4"/><line x1="522" y1="72" x2="522" y2="96" stroke="#F2A33A" stroke-width="2" stroke-dasharray="4 4"/><line x1="708" y1="72" x2="708" y2="96" stroke="#F2A33A" stroke-width="2" stroke-dasharray="4 4"/><rect x="32" y="104" width="176" height="236" rx="10" fill="#14808F" fill-opacity="0.14"/><rect x="32" y="104" width="176" height="8" rx="4" fill="#14808F"/><text x="48" y="140" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#0E1F2B">Pull request</text><text x="48" y="168" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">head commit</text><text x="48" y="190" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64"></text><text x="48" y="212" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">red commits:</text><text x="48" y="234" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">the new tests and</text><text x="48" y="256" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">stubs, with a</text><text x="48" y="278" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">Lockflight-Red</text><text x="48" y="300" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">trailer</text><rect x="232" y="104" width="196" height="236" rx="10" fill="#14808F" fill-opacity="0.14"/><rect x="232" y="104" width="196" height="8" rx="4" fill="#14808F"/><text x="248" y="140" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#0E1F2B">judge</text><text x="248" y="162" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" fill="#C47A12">no secret</text><text x="248" y="188" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">re-runs each red</text><text x="248" y="210" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">commit: new tests fail</text><text x="248" y="232" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">in production code</text><text x="248" y="254" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">green at head,</text><text x="248" y="276" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">tests unchanged</text><text x="248" y="298" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">trace, the pr gates</text><rect x="452" y="104" width="140" height="236" rx="10" fill="#14808F" fill-opacity="0.14"/><rect x="452" y="104" width="140" height="8" rx="4" fill="#14808F"/><text x="468" y="140" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#0E1F2B">review</text><text x="468" y="162" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" fill="#C47A12">optional, API key</text><text x="468" y="188" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">findings count</text><text x="468" y="210" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">only with a</text><text x="468" y="232" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">failing</text><text x="468" y="254" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">reproduction</text><rect x="616" y="104" width="184" height="236" rx="10" fill="#14808F" fill-opacity="0.14"/><rect x="616" y="104" width="184" height="8" rx="4" fill="#14808F"/><text x="632" y="140" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#0E1F2B">report</text><text x="632" y="162" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" fill="#C47A12">runs no PR code</text><text x="632" y="188" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">reads both</text><text x="632" y="210" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">results as data</text><text x="632" y="232" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">sets two checks:</text><text x="632" y="254" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64"></text><text x="632" y="276" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64"></text><text x="632" y="298" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">posts the PR</text><text x="632" y="320" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">comment</text><text x="632" y="254" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0E1F2B">gates</text><text x="632" y="274" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0E1F2B">lockflight/judge</text><line x1="208" y1="222" x2="224" y2="222" stroke="#4A5A64" stroke-width="2"/><path d="M232,222 l-10,-6 v12 z" fill="#4A5A64"/><line x1="428" y1="222" x2="444" y2="222" stroke="#4A5A64" stroke-width="2"/><path d="M452,222 l-10,-6 v12 z" fill="#4A5A64"/><line x1="592" y1="222" x2="608" y2="222" stroke="#4A5A64" stroke-width="2"/><path d="M616,222 l-10,-6 v12 z" fill="#4A5A64"/><line x1="800" y1="222" x2="824" y2="222" stroke="#4A5A64" stroke-width="2"/><path d="M832,222 l-10,-6 v12 z" fill="#4A5A64"/><text x="840" y="118" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#0E1F2B">Verdict</text><rect x="840" y="136" width="168" height="40" rx="8" fill="#2F8F5B" fill-opacity="0.18"/><rect x="840" y="136" width="6" height="40" rx="3" fill="#2F8F5B"/><text x="858" y="162" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0E1F2B">PASS</text><rect x="840" y="186" width="168" height="40" rx="8" fill="#C9483B" fill-opacity="0.18"/><rect x="840" y="186" width="6" height="40" rx="3" fill="#C9483B"/><text x="858" y="212" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0E1F2B">FAIL</text><rect x="840" y="236" width="168" height="40" rx="8" fill="#F2A33A" fill-opacity="0.18"/><rect x="840" y="236" width="6" height="40" rx="3" fill="#F2A33A"/><text x="858" y="262" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0E1F2B">NOT-EARNED</text><rect x="840" y="286" width="168" height="40" rx="8" fill="#7D8B93" fill-opacity="0.18"/><rect x="840" y="286" width="6" height="40" rx="3" fill="#7D8B93"/><text x="858" y="312" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0E1F2B">ERROR</text><text x="520" y="372" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#4A5A64">LLMs propose; checks decide. The verdict comes from what the judge re-ran, not from the agent's word.</text></svg>
