<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img"><title>How the CI judge works: the pull request is judged under the target branch's policy by the judge, review and report jobs, and the report jobs set two status contexts with one of four verdicts</title><rect width="1040" height="400" rx="20" fill="#0B1822" stroke="#24384A"/><rect x="232" y="28" width="568" height="44" rx="10" fill="#F2A33A" fill-opacity="0.16"/><text x="516" y="56" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="700" fill="#E6EEF2">Target branch: policy, baselines and the pinned engine</text><line x1="330" y1="72" x2="330" y2="96" stroke="#F2A33A" stroke-width="2" stroke-dasharray="4 4"/><line x1="522" y1="72" x2="522" y2="96" stroke="#F2A33A" stroke-width="2" stroke-dasharray="4 4"/><line x1="708" y1="72" x2="708" y2="96" stroke="#F2A33A" stroke-width="2" stroke-dasharray="4 4"/><rect x="32" y="104" width="176" height="236" rx="10" fill="#14808F" fill-opacity="0.14"/><rect x="32" y="104" width="176" height="8" rx="4" fill="#14808F"/><text x="48" y="140" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#E6EEF2">Pull request</text><text x="48" y="168" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">head commit</text><text x="48" y="190" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC"></text><text x="48" y="212" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">red commits:</text><text x="48" y="234" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">the new tests and</text><text x="48" y="256" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">stubs, with a</text><text x="48" y="278" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">Lockflight-Red</text><text x="48" y="300" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">trailer</text><rect x="232" y="104" width="196" height="236" rx="10" fill="#14808F" fill-opacity="0.14"/><rect x="232" y="104" width="196" height="8" rx="4" fill="#14808F"/><text x="248" y="140" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#E6EEF2">judge</text><text x="248" y="162" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" fill="#F2A33A">no secret</text><text x="248" y="188" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">re-runs each red</text><text x="248" y="210" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">commit: new tests fail</text><text x="248" y="232" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">in production code</text><text x="248" y="254" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">green at head,</text><text x="248" y="276" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">tests unchanged</text><text x="248" y="298" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">trace, the pr gates</text><rect x="452" y="104" width="140" height="236" rx="10" fill="#14808F" fill-opacity="0.14"/><rect x="452" y="104" width="140" height="8" rx="4" fill="#14808F"/><text x="468" y="140" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#E6EEF2">review</text><text x="468" y="162" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" fill="#F2A33A">optional, API key</text><text x="468" y="188" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">findings count</text><text x="468" y="210" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">only with a</text><text x="468" y="232" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">failing</text><text x="468" y="254" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">reproduction</text><rect x="616" y="104" width="184" height="236" rx="10" fill="#14808F" fill-opacity="0.14"/><rect x="616" y="104" width="184" height="8" rx="4" fill="#14808F"/><text x="632" y="140" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#E6EEF2">report ×2</text><text x="632" y="162" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" fill="#F2A33A">runs no PR code</text><text x="632" y="188" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">read both</text><text x="632" y="210" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">results as data</text><text x="632" y="232" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">set two checks:</text><text x="632" y="254" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC"></text><text x="632" y="276" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC"></text><text x="632" y="298" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">one posts the PR</text><text x="632" y="320" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">comment</text><text x="632" y="254" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#E6EEF2">gates</text><text x="632" y="274" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#E6EEF2">lockflight/judge</text><line x1="208" y1="222" x2="224" y2="222" stroke="#9FB2BC" stroke-width="2"/><path d="M232,222 l-10,-6 v12 z" fill="#9FB2BC"/><line x1="428" y1="222" x2="444" y2="222" stroke="#9FB2BC" stroke-width="2"/><path d="M452,222 l-10,-6 v12 z" fill="#9FB2BC"/><line x1="592" y1="222" x2="608" y2="222" stroke="#9FB2BC" stroke-width="2"/><path d="M616,222 l-10,-6 v12 z" fill="#9FB2BC"/><line x1="800" y1="222" x2="824" y2="222" stroke="#9FB2BC" stroke-width="2"/><path d="M832,222 l-10,-6 v12 z" fill="#9FB2BC"/><text x="840" y="118" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#E6EEF2">Verdict</text><rect x="840" y="136" width="168" height="40" rx="8" fill="#2F8F5B" fill-opacity="0.18"/><rect x="840" y="136" width="6" height="40" rx="3" fill="#2F8F5B"/><text x="858" y="162" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#E6EEF2">PASS</text><rect x="840" y="186" width="168" height="40" rx="8" fill="#C9483B" fill-opacity="0.18"/><rect x="840" y="186" width="6" height="40" rx="3" fill="#C9483B"/><text x="858" y="212" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#E6EEF2">FAIL</text><rect x="840" y="236" width="168" height="40" rx="8" fill="#F2A33A" fill-opacity="0.18"/><rect x="840" y="236" width="6" height="40" rx="3" fill="#F2A33A"/><text x="858" y="262" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#E6EEF2">NOT-EARNED</text><rect x="840" y="286" width="168" height="40" rx="8" fill="#7D8B93" fill-opacity="0.18"/><rect x="840" y="286" width="6" height="40" rx="3" fill="#7D8B93"/><text x="858" y="312" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#E6EEF2">ERROR</text><text x="520" y="372" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" fill="#9FB2BC">LLMs propose; checks decide. The verdict comes from what the judge re-ran, not from the agent's word.</text></svg>
