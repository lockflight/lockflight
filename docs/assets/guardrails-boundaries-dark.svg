<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img"><title>Guardrails run on your machine, where the agent has your credentials; boundaries are decided outside the agent's reach</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9FB2BC"/></marker></defs><rect width="1040" height="400" rx="20" fill="#0B1822" stroke="#24384A"/><rect x="30" y="30" width="440" height="340" rx="14" fill="#10222F" stroke="#F2A33A" stroke-width="2"/><text x="56" y="70" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="24" font-weight="800" fill="#E6EEF2">Guardrails</text><text x="56" y="96" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#9FB2BC">On your machine, with your credentials</text><text x="56" y="118" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#9FB2BC">They prevent accidents; a determined agent can get around them.</text><rect x="570" y="30" width="440" height="340" rx="14" fill="#10222F" stroke="#14808F" stroke-width="2"/><text x="596" y="70" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="24" font-weight="800" fill="#E6EEF2">Boundaries</text><text x="596" y="96" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#9FB2BC">Outside the agent's reach</text><text x="596" y="118" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#9FB2BC">They hold even against a determined agent.</text><rect x="56" y="140" width="388" height="34" rx="8" fill="#F2A33A" fill-opacity="0.22"/><text x="72" y="162" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#E6EEF2">The guard on protected paths</text><rect x="56" y="184" width="388" height="34" rx="8" fill="#F2A33A" fill-opacity="0.22"/><text x="72" y="206" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#E6EEF2">The Stop gate</text><rect x="56" y="228" width="388" height="34" rx="8" fill="#F2A33A" fill-opacity="0.22"/><text x="72" y="250" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#E6EEF2">Red/green evidence and the trace</text><rect x="56" y="272" width="388" height="34" rx="8" fill="#F2A33A" fill-opacity="0.22"/><text x="72" y="294" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#E6EEF2">The review of record</text><rect x="56" y="316" width="388" height="34" rx="8" fill="#F2A33A" fill-opacity="0.22"/><text x="72" y="338" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#E6EEF2">Approvals recorded locally</text><rect x="596" y="140" width="388" height="34" rx="8" fill="#14808F" fill-opacity="0.22"/><text x="612" y="162" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#E6EEF2">CI with the base branch's policy, as a required check</text><rect x="596" y="184" width="388" height="34" rx="8" fill="#14808F" fill-opacity="0.22"/><text x="612" y="206" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#E6EEF2">The spec approved in the pull request (CODEOWNERS)</text><rect x="596" y="228" width="388" height="34" rx="8" fill="#14808F" fill-opacity="0.22"/><text x="612" y="250" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" fill="#E6EEF2">Merge, when the agent has its own identity</text><line x1="520" y1="40" x2="520" y2="360" stroke="#9FB2BC" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 6"/><rect x="478" y="170" width="84" height="22" fill="#0B1822"/><text x="520" y="186" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#9FB2BC">pull request</text><line x1="476" y1="206" x2="562" y2="206" stroke="#9FB2BC" stroke-width="2.5" marker-end="url(#head)"/><g shape-rendering="crispEdges"><rect x="932" y="294" width="16" height="4" fill="#14808F"/><rect x="924" y="298" width="12" height="4" fill="#14808F"/><rect x="936" y="298" width="8" height="4" fill="#F2A33A"/><rect x="944" y="298" width="12" height="4" fill="#14808F"/><rect x="920" y="302" width="40" height="4" fill="#14808F"/><rect x="916" y="306" width="4" height="4" fill="#7A3F1A"/><rect x="920" y="306" width="40" height="4" fill="#C0682F"/><rect x="960" y="306" width="4" height="4" fill="#7A3F1A"/><rect x="916" y="310" width="48" height="4" fill="#C0682F"/><rect x="916" y="314" width="8" height="4" fill="#C0682F"/><rect x="924" y="314" width="4" height="4" fill="#FFFFFF"/><rect x="928" y="314" width="4" height="4" fill="#141414"/><rect x="932" y="314" width="16" height="4" fill="#C0682F"/><rect x="948" y="314" width="4" height="4" fill="#FFFFFF"/><rect x="952" y="314" width="4" height="4" fill="#141414"/><rect x="956" y="314" width="8" height="4" fill="#C0682F"/><rect x="916" y="318" width="8" height="4" fill="#C0682F"/><rect x="924" y="318" width="8" height="4" fill="#141414"/><rect x="932" y="318" width="16" height="4" fill="#C0682F"/><rect x="948" y="318" width="8" height="4" fill="#141414"/><rect x="956" y="318" width="8" height="4" fill="#C0682F"/><rect x="916" y="322" width="20" height="4" fill="#C0682F"/><rect x="936" y="322" width="8" height="4" fill="#141414"/><rect x="944" y="322" width="20" height="4" fill="#C0682F"/><rect x="916" y="326" width="16" height="4" fill="#C0682F"/><rect x="932" y="326" width="4" height="4" fill="#F0C08E"/><rect x="936" y="326" width="8" height="4" fill="#FFFFFF"/><rect x="944" y="326" width="4" height="4" fill="#F0C08E"/><rect x="948" y="326" width="16" height="4" fill="#C0682F"/><rect x="916" y="330" width="16" height="4" fill="#C0682F"/><rect x="932" y="330" width="4" height="4" fill="#F0C08E"/><rect x="936" y="330" width="8" height="4" fill="#FFFFFF"/><rect x="944" y="330" width="4" height="4" fill="#F0C08E"/><rect x="948" y="330" width="16" height="4" fill="#C0682F"/><rect x="912" y="334" width="16" height="4" fill="#C0682F"/><rect x="928" y="334" width="24" height="4" fill="#F0C08E"/><rect x="952" y="334" width="16" height="4" fill="#C0682F"/><rect x="912" y="338" width="12" height="4" fill="#C0682F"/><rect x="924" y="338" width="32" height="4" fill="#F0C08E"/><rect x="956" y="338" width="8" height="4" fill="#C0682F"/><rect x="964" y="338" width="8" height="4" fill="#7A3F1A"/><rect x="916" y="342" width="8" height="4" fill="#C0682F"/><rect x="924" y="342" width="32" height="4" fill="#F0C08E"/><rect x="956" y="342" width="4" height="4" fill="#C0682F"/><rect x="960" y="342" width="12" height="4" fill="#7A3F1A"/><rect x="920" y="346" width="8" height="4" fill="#7A3F1A"/><rect x="952" y="346" width="8" height="4" fill="#7A3F1A"/></g><text x="520" y="386" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#9FB2BC">the agent's reach ends here</text></svg>
