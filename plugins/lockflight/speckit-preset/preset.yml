schema_version: "1.0"

preset:
  id: "lockflight"
  name: "Lockflight"
  version: "0.1.0"
  description: "Test-first tasks with requirement IDs and red/green stubs, checked by Lockflight phase checks"
  author: "lockflight"
  repository: "https://github.com/lockflight/lockflight"
  license: "MIT"

requires:
  # templates/tasks-template.md is generated by scripts/speckit-preset/regenerate.py (repository root) from this exact Spec Kit
  # version's stock template; commands/speckit.tasks.md is appended to the stock /speckit-tasks command.
  speckit_version: ">=1.1.3"

provides:
  templates:
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tests are mandatory and come first; stubs before tests; every task cites requirement IDs"
      replaces: "tasks-template"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Appends Lockflight rules to /speckit-tasks: tests mandatory and first, (FR-xxx) on every story task, stubs before tests"
      replaces: "speckit.tasks"
      strategy: "append"
